spring.datasource.url=jdbc:h2:mem:trading;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
# Generate the same DDL as production PostgreSQL

jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256-signing
stripe.api.key=
razorpay.api.key=
razorpay.api.secret=
app.frontend.url=http://localhost:5173
spring.mail.host=localhost
# In-memory cache so tests run without Redis
spring.cache.type=simple
spring.jpa.database-platform=com.nikit.support.H2PostgreSQLDialect
spring.jpa.open-in-view=false
# Background jobs and Redis-backed features use in-memory versions or are off in tests
app.store=memory
app.live-prices.enabled=false
app.snapshots.scheduled=false
app.rate-limit.enabled=false
