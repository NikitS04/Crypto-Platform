spring.application.name=Trading

server.port=5454

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trading}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
#spring.jpa.show-sql: true

# Secrets are read from the environment - never commit real values
jwt.secret=${JWT_SECRET}
stripe.api.key=${STRIPE_API_KEY:}
razorpay.api.key=${RAZORPAY_API_KEY:}
razorpay.api.secret=${RAZORPAY_API_SECRET:}

# Market data cache (see CacheConfig for per-cache TTLs)
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Optional CoinGecko demo key - raises the free-tier rate limit
coingecko.api.key=${COINGECKO_API_KEY:}

management.endpoints.web.exposure.include=health,metrics,caches
# Email is optional (2FA / password reset only), so an SMTP problem must not mark the whole app unhealthy
management.health.mail.enabled=false

# Redis-backed live prices, leaderboard and rate limiter ("memory" = single-instance in-memory versions)
app.store=redis

# Live prices streamed from Binance's free public market data feed
app.live-prices.enabled=true
app.live-prices.url=${LIVE_PRICES_URL:wss://stream.binance.com:9443/ws/!miniTicker@arr}

# Portfolio snapshots for the analytics equity curve (also taken after every trade/transfer)
app.snapshots.interval-ms=900000

# Token bucket limits: capacity = burst size, refill = sustained requests per second
app.rate-limit.enabled=true
app.rate-limit.auth.capacity=10
app.rate-limit.auth.refill-per-second=0.2
app.rate-limit.api.capacity=60
app.rate-limit.api.refill-per-second=2

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Each transaction gets its own persistence context, so locked reads always see the latest row
spring.jpa.open-in-view=false
